; ============================================================
; BED BOX SHEMI - TEST 018
; QuinLED-ESP32 (WROOM-32E)
; ============================================================
;
; TEST 018 adds 7 NeoPixels on GPIO23 for RS485 diagnostics.
; RS485 Serial2 remains RX=16 / TX=17.
;
; ============================================================

[env:bedbox]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600


lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

