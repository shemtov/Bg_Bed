; BEDBOX - QuinLED-ESP32 (WROOM-32E)
; This is the combination that actually compiled. Do not pin the platform
; version and do not add the Arduino core as a lib_deps entry - both were
; tried and both failed. Use Arduino ledcSetup / ledcAttachPin / ledcWrite,
; never a raw driver/ledc.h include.

[env:bedbox]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
