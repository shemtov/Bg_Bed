; BEDBOX - QuinLED-ESP32 (WROOM-32E)
; Goes in  Bg_Bed/bedbox/platformio.ini  - next to the src/ folder.
;
; This is the combination that actually compiled. Do not pin the platform
; version and do not add the Arduino core as a lib_deps entry - both were
; tried and both failed. Use Arduino ledcSetup / ledcAttachPin / ledcWrite,
; never a raw driver/ledc.h include.
;
; Unpinned espressif32 resolves to the 6.x line, which carries Arduino core
; 2.x - and that is exactly what we want here, because ledcSetup and
; ledcAttachPin still exist there. Core 3.x removed them, but core 3.x only
; arrives through the pioarduino fork, not through this platform name.
;
; Serial2 for the panel link is opened in main.cpp on RX 16 / TX 17.
; Nothing about that needs to appear here.

[env:bedbox]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Keep the serial monitor from resetting the board when it connects.
; TEST 008 resumes its last setting on boot, and a monitor that silently
; reboots the board makes that impossible to test. Uploading still resets
; normally - this only affects opening the monitor.
monitor_rts = 0
monitor_dtr = 0
