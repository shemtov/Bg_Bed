; ============================================================
; BEDBOX IRA - TEST 002 (L298N static test)
; ============================================================
;
; ESP32-S3-DevKitC-1 N16R8.
;
; For bedbox_shemi (QuinLED, classic ESP32) change the MOTOR[] table
; in main.cpp to 13,14,18,19,21,22 and swap this env for:
;   platform = espressif32
;   board    = esp32dev
; The LEDC API differs between the two cores, so do not mix them.
;
; ============================================================

[env:esp32s3]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu                 = esp32s3
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv

board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
upload_speed  = 921600
monitor_rts   = 0
monitor_dtr   = 0

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; ============================================================
; END OF FILE - BEDBOX IRA - TEST 002 (L298N static test)
; ============================================================
