; ============================================================
; RF LEARN - TEST 005 (transmit, ESP32-S3 DevKitC-1)
; ============================================================
;
; ESP32-S3-DevKitC-1 N16R8 - 16MB flash, 8MB octal PSRAM.
;
; pioarduino, not plain espressif32: the S3 needs Arduino core 3.x.
;
; memory_type is qio_opi - the flash is QUAD, the PSRAM is OCTAL.
; opi_opi assumes octal flash and gives a dead board with no serial.
;
; board_upload.* is set separately from board_build.* on purpose.
; Setting only board_build makes the bootloader assume the wrong
; chip variant, which also gives a dead board with no serial.
;
; ARDUINO_USB_CDC_ON_BOOT = 0 sends Serial out of UART0 - the CP2102
; connector, the one marked UART. Set it to 1 only if the cable is in
; the connector marked USB instead. Getting this backwards looks like
; a crash: the ROM boot log appears but the sketch never prints.
;
; ============================================================

[env:esp32s3]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu                = esp32s3
board_build.flash_mode         = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions         = default_16MB.csv

board_upload.flash_size    = 16MB
board_upload.maximum_size  = 16777216

monitor_speed = 115200
upload_speed  = 921600

; The CP2102's DTR and RTS lines are wired to the auto-reset circuit.
; Left alone, opening the serial monitor yanks GPIO0 low and the chip
; lands in ROM download mode - "waiting for download", sketch never runs.
; Zeroing both stops the monitor from touching those lines.
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    sui77/rc-switch@^2.6.4

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; ============================================================
; END OF FILE - RF LEARN - TEST 005 (transmit, ESP32-S3 DevKitC-1)
; ============================================================
