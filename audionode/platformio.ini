; Audio node - ESP32-CAM (AI-Thinker) + PCM5102A I2S DAC
; Separate PlatformIO project. Open the audionode folder in VS Code,
; never the repository root.
;
; NOTE ON THE PLATFORM VERSION
; The panel is pinned to espressif32 @ 6.9.0 because GFX Library 1.3.8
; will not build against newer ESP-IDF headers. That constraint does
; NOT apply here - there is no display library. This project is left
; unpinned on purpose, because ESP32-audioI2S 3.x expects the newer
; Arduino core 3.x. Do not copy the panel's pin across.
;
; NOTE ON THE LIBRARY VERSION - this one was learned the hard way
; The library must be pinned to 3.4.0. Unpinned it fetches 3.4.7,
; which calls dsps_biquad_sf32() from a newer esp-dsp than the
; platform ships, and the build dies with:
;   Audio.cpp:6945:5: error: 'dsps_biquad_sf32' was not declared in
;   this scope; did you mean 'dsps_biquad_f32'?
; Versions 3.1.0 to 3.4.0 do not call it at all. Note that 3.4.0 uses
; the OLD callback style - free functions like audio_showstation() -
; not the Audio::msg_t struct of 3.4.7. main.cpp matches 3.4.0.
;
; NOTE ON monitor_rts AND monitor_dtr - also learned the hard way
; Opening the serial monitor was STOPPING the board dead. A monitor
; asserts DTR and RTS by default; on ESP32 boards those lines drive
; EN (reset) and GPIO0 (boot select) for automatic flashing. The
; ESP32-CAM-MB has no circuit to prevent that when you only want to
; watch, so opening the monitor dropped the chip into the bootloader
; and it sat there silent. Zero tells the monitor to leave them be.
;
; The ESP32-CAM has 4MB PSRAM and the audio library requires PSRAM,
; so -DBOARD_HAS_PSRAM is not optional here.

[env:audionode]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder, send_on_enter
upload_speed = 460800

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.0