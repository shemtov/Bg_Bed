; =============================================================================
;  AUDIO NODE  -  WT32-ETH01  (classic ESP32 + LAN8720 wired Ethernet)
;  Feeds a PCM5102A I2S DAC -> 3.5mm -> soundbar.
;  Listens on the shared bed-box UART as id 9.
;
;  No firmware yet - src/ is empty. This is TEST 001 when we write it.
;
;  NOTE: this board has NO USB. Flash it with an external USB-to-TTL adapter
;  on TXD0/RXD0, holding IO0 to GND at power-up to enter programming mode,
;  then remove IO0 and power-cycle to run.
; =============================================================================
[env:audionode]
platform = espressif32
board = wt32-eth01
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
  -DCORE_DEBUG_LEVEL=1

; Ethernet (ETH.h) is built into the ESP32 Arduino core - no library needed.
; Pin map is fixed by the board: MDC=23, MDIO=18, power=16, clock=GPIO0 in.
lib_deps =
  esphome/ESP32-audioI2S@^2.0.0

; Free pins on this board (Ethernet takes most of them):
;   I2S  BCK=14  LRCK=32  DOUT=33
;   UART TX=4    RX=36    (RX is input-only, which is fine)
; Avoid 2, 5, 12, 15 - strapping pins, they can stop the board booting.
