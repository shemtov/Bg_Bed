; ============================================================
;                        TEST  006
;               AUDIO NODE  -  ESP32-S3-WROOM-1 N16R8
; ============================================================
;
;  Arduino core 3.x is required. The W5500 is only supported
;  natively inside ETH.h from core 3.0 onwards, and the official
;  espressif32 platform is still stuck on core 2.x. That is why
;  this uses the pioarduino build.
;
;  This is deliberately NOT the same platform as panel_shemi,
;  which stays pinned at espressif32 @ 6.9.0 for its own reasons.
;  Separate projects, separate platforms. Do not unify them.
;
; ============================================================

[env:audionode]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

upload_speed = 921600

; ============================================================
;                        TEST  006
;        ethernet bring-up only - no audio libraries yet
; ============================================================