; ============================================================
;                        TEST  010
;               AUDIO NODE  -  ESP32-S3-WROOM-1 N16R8
; ============================================================
;
;  Back to radio. The audio library returns to lib_deps after
;  TEST 009 removed it for the tone diagnostic.
;
;  TEST 009 proved: the DAC, the solder bridges, the three signal
;  wires, the optical cable and the soundbar are all good.
;  The faulty part was the analog-to-digital converter box, now
;  replaced.
;
;  Arduino core 3.x is required for the W5500 inside ETH.h.
;  The panels stay on espressif32 @ 6.9.0. Do NOT unify them.
;
; ============================================================

[env:audionode]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, send_on_enter
monitor_rts = 0
monitor_dtr = 0

upload_speed = 921600

; ============================================================
;                        TEST  010
;      radio over wired ethernet - autoplay, serial control
; ============================================================