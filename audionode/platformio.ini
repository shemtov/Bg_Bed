; ============================================================
;                        TEST  011
;               AUDIO NODE  -  ESP32-S3-WROOM-1 N16R8
; ============================================================
;
;  NEW IN 011: a web page served by the node itself.
;  Open http://192.168.1.195 from your phone or PC.
;
;  No new library needed - the WebServer class ships with the
;  Arduino core. Nothing added to lib_deps.
;
;  Arduino core 3.x is required for the W5500 inside ETH.h.
;  The panels stay on espressif32 @ 6.9.0. Do NOT unify them.
;
; ============================================================

[env:audionode]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, send_on_enter
monitor_rts = 0
monitor_dtr = 0

upload_speed = 921600

; ============================================================
;                        TEST  011
;        radio over ethernet + phone control via web page
; ============================================================
