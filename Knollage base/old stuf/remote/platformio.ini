; =============================================================================
;  Bedside remote  -  Waveshare ESP32-S3-Touch-LCD-4.3
;  Open this folder in VS Code with the PlatformIO extension.
;
;  The RGB panel needs Arduino-ESP32 core v3.x. The stock PlatformIO
;  "espressif32" platform still ships core 2.x, so we use the community
;  "pioarduino" platform build, which packages core 3.x.
;
;  NOTE: check https://github.com/pioarduino/platform-espressif32/releases
;  for the newest release tag and update the URL below if needed.
; =============================================================================
[env:waveshare-s3-4p3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi     ; enables OPI PSRAM
build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    moononournation/GFX Library for Arduino
    bitbank2/bb_captouch
    ; Preferences is part of the ESP32 Arduino core (no entry needed)
