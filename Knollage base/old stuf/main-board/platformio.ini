; =============================================================================
;  Main motor board  -  classic ESP32 (WROOM-32) under the bed
;  Open this folder in VS Code with the PlatformIO extension installed.
;  Uses the portable (2.x-compatible) LEDC API, so it builds on the stock
;  espressif32 platform - no special core needed.
; =============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
