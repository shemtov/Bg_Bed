; =============================================================================
;  Headboard panel  -  Waveshare ESP32-S3-Touch-LCD-4.3
;  Massage control (2 beds) + internet radio + auto brightness
;
;  Open this folder in VS Code with the PlatformIO extension.
;  Uses the community "pioarduino" platform (Arduino core 3.x, needed for the
;  RGB panel). Check github.com/pioarduino/platform-espressif32/releases and
;  bump the URL if a newer release exists.
; =============================================================================
[env:panel]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    lvgl/lvgl@^8.4.0
    moononournation/GFX Library for Arduino@^1.4.9
    bitbank2/bb_captouch
    esphome/ESP32-audioI2S@^2.0.0
    bblanchon/ArduinoJson@^7.0.0
