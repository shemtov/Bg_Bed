; ============================================================
;  BedSystem / panel   —  ESP32-S3  800x480 RGB touch panel
;  Intended for  panel/src/main.cpp  TEST 041
;  (the test number lives INSIDE main.cpp, never in a filename)
;
;  NOT VERIFIED AGAINST THE CODE.  panel/src/main.cpp is not in
;  the project files, so lib_deps below is deduced, not proven.
;  See the notes in chat before trusting the library list.
; ============================================================

[env:panel]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---- memory: N16R8 = 16MB QUAD flash + 8MB OCTAL PSRAM ----
; memory_type is the line that actually makes octal PSRAM come up.
; Without it the 800x480 LVGL framebuffer allocation fails at runtime.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE          ; lets LVGL find include/lv_conf.h
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0       ; serial goes out the CH340, not native USB
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  lvgl/lvgl@^8.4.0
  moononournation/GFX Library for Arduino@^1.4.9
  bblanchon/ArduinoJson@^6.21.5

; ---- TOUCH DRIVER: not included, because I do not know which one
; your main.cpp #includes. Uncomment exactly ONE, matching the code:
;  bitbank2/bb_captouch                    ; GT911 capacitive (handoff Rev3 says this)
;  https://github.com/TAMCTec/gt911-arduino ; alternative GT911 driver
;  paulstoffregen/XPT2046_Touchscreen      ; resistive — the chip visible in your board photo

; ---- ESP32-audioI2S: deliberately REMOVED.
; In Rev 4 the panel does not stream audio; it sends UART commands 6-9
; to the audio node. If main.cpp still #includes "Audio.h", add:
;   https://github.com/schreibfaul1/ESP32-audioI2S
; and be aware its recent versions need Arduino core 3.x (pioarduino),
; not the stock espressif32 platform above.

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600