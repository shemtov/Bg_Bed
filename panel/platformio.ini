; PANEL - Guition ESP32-8048S043 (ESP32-S3-WROOM-1 N16R8)
; v4 configuration. LV_CONF_SKIP means LVGL is configured by the build
; flags below and NO lv_conf.h file is needed anywhere.

[env:panel]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_SKIP
  -DLV_COLOR_DEPTH=16
  -DLV_TICK_CUSTOM=1
  -DLV_FONT_MONTSERRAT_20=1
  -DLV_FONT_MONTSERRAT_28=1
  -DLV_FONT_MONTSERRAT_40=1

lib_deps =
  moononournation/GFX Library for Arduino @ 1.3.8
  bitbank2/JPEGDEC @ ^1.2.8
  lvgl/lvgl @ ^8.3.11
