; PANEL - Guition ESP32-8048S043 (ESP32-S3-WROOM-1 N16R8)
; v6 - fixes the boot loop.
;
; v5 kept board = esp32-s3-devkitc-1, which is the N8 variant: 8MB flash,
; NO PSRAM. Pairing that with a 16MB partition table put the app past the
; end of the flash the bootloader believed in, so it reset forever without
; ever reaching setup(). Hence a black screen and no serial banner.
;
; Fix: name the real module and set BOTH the build and the upload flash
; size. board_build.* feeds the compiler, board_upload.* feeds the
; bootloader header - the second one is what v5 was missing.

[env:panel]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_SKIP
  -DLV_COLOR_DEPTH=16
  -DLV_TICK_CUSTOM=1
  -DLV_FONT_MONTSERRAT_20=1
  -DLV_FONT_MONTSERRAT_28=1
  -DLV_FONT_MONTSERRAT_40=1

lib_deps =
  moononournation/GFX Library for Arduino @ 1.3.8
  bitbank2/JPEGDEC @ ^1.2.8
  lvgl/lvgl @ ^8.3.11

; IF THE CHIP TURNS OUT TO BE 8MB, swap the six board_* lines above for:
;   board_build.arduino.memory_type = qio_opi
;   board_build.flash_size = 8MB
;   board_build.partitions = default_8MB.csv
;   board_upload.flash_size = 8MB
;   board_upload.maximum_size = 8388608
; The firmware is only ~764KB, so 8MB is plenty. PSRAM is the part that
; is not optional - without it the display buffer cannot be allocated.