; PANEL - Guition ESP32-8048S043 (ESP32-S3-WROOM-1 N16R8)
; v7 - same as v6, plus the exception decoder.
;
; monitor_filters = esp32_exception_decoder turns a crash backtrace from
; bare hex addresses into real file names and line numbers, e.g.
;   0x4200ed28: showPhoto(char const*) at src/main.cpp:296
; It reads .pio/build/panel/firmware.elf, so the decode always matches the
; firmware currently on the board. Costs nothing; leave it on permanently.

[env:panel]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_SKIP
  -DLV_COLOR_DEPTH=16
  -DLV_TICK_CUSTOM=1
  -DLV_FONT_MONTSERRAT_20=1
  -DLV_FONT_MONTSERRAT_28=1
  -DLV_FONT_MONTSERRAT_40=1

lib_deps =
  moononournation/GFX Library for Arduino @ 1.3.8
  bitbank2/JPEGDEC @ ^1.2.8
  lvgl/lvgl @ ^8.3.11