; WHAT CHANGED IN TEST 012 vs TEST 011
;   Nothing here. The vibration motor uses LEDC, which is in the
;   core. But note WHY the API in main.cpp is the new one: this
;   platform line is pioarduino, which is Arduino core 3.x, and
;   core 3.x DELETED ledcSetup and ledcAttachPin. It is ledcAttach
;   and a ledcWrite that takes the pin instead of a channel. Code
;   copied from any pre-3.x example will not compile here.
;
;   LEDC is completely unused elsewhere in this panel, so all eight
;   channels are free. That is not true of bedbox_ira, where eight
;   motors take every one of them.
;
; WHAT CHANGED IN TEST 011 vs TEST 010
;   Nothing here. No new library. The RTC and SHT3x drivers are
;   written against driver/i2c_master.h, which lib/i2c already
;   pulls in - deliberately, because Wire uses the OLD I2C driver
;   and the two cannot both own I2C_NUM_0. That rules out RTClib,
;   Adafruit_SHT31 and every other Arduino I2C library on this
;   board. It is not a preference, it is the driver model.
;
; WHAT CHANGED IN TEST 010 vs TEST 009
;   Nothing there either. No new library, no new flag. The scan uses
;   driver/i2c_master.h, which lib/i2c already pulls in, and the
;   bus that touch_gt911_init() already created.
;
; WHAT CHANGED IN TEST 009 vs TEST 002
;   Nothing there. TEST 002 uploaded and ran: 1024x600 confirmed,
;   GT911 touch confirmed, backlight through the IO expander
;   confirmed, PSRAM read 8,384,788 free of 8,388,608 - a genuine
;   8 MB part, not a downgraded clone.
;
;   All the change is in main.cpp, which now draws the home screen.
;
; NEEDED IN include/  - all already in the repo under panel_shemi:
;   tile_img.h     eight 200x200 tile icons
;   lamp_img.h     the 200x200 lamp
;   fan_img.h      the 200x200 ceiling fan, recovered from TEST 082
;   font_hebrew.h  font_hebrew_28, Hebrew and Latin
;
; STILL NEEDED, unchanged:
;   boards\ESP32-S3-Touch-LCD-7B.json
;   lib\   the whole folder from the Waveshare demo.
;   boards and lib are SIBLINGS directly under panel_shemi.
;
; UPLOAD
;   Hold BOOT, press and release RESET, release BOOT, then Upload.
;   The screen staying dark is how you know the ROM bootloader was
;   entered. Press RESET afterwards to run.
;
; ============================================================

[env:ESP32-S3-Touch-LCD-7B]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

board     = ESP32-S3-Touch-LCD-7B
framework = arduino

upload_port  = COM11
monitor_port = COM11

upload_speed = 921600
monitor_speed = 115200

monitor_rts = 0
monitor_dtr = 0

; "echo" IS NOT A REAL FILTER. TEST 012 had it here and PlatformIO
; answered "Skipping unknown filters `echo`". The legal list is
; debug, default, direct, esp32_exception_decoder, hexlify, log2file,
; nocontrol, printable, send_on_enter, time.
;
; So typing is blind - characters do not appear as they are typed.
; send_on_enter still buffers the whole line and sends it on Enter,
; which is what the T command needs.
monitor_filters = send_on_enter, esp32_exception_decoder

; JPEGDEC decodes the boot photographs in include/boot_photo.h.
; The first added library in this project - everything else has been
; local, under lib/. PlatformIO fetches it on the next build, so
; that one build needs the internet.
lib_deps =
        bitbank2/JPEGDEC@^1.6.1

build_flags =
        -DDISABLE_ALL_LIBRARY_WARNINGS
        -DUSB_MODE=1
        -DARDUINO_USB_CDC_ON_BOOT=0
        -DCORE_DEBUG_LEVEL=1
        -I src
        -I include

