; ============================================================
; PANEL SHEMI - TEST 002 (7B bring-up, upload fix)
; ============================================================
;
; Waveshare ESP32-S3-Touch-LCD-7B, 1024 x 600.
;
; WHAT CHANGED vs TEST 001
;   TEST 001 built cleanly - RAM 22.4%, Flash 8.0% - but would not
;   upload. Two problems, both here:
;
;   upload_speed was 921600. That is aggressive and fails on a
;   mediocre cable, through a hub, or on a board being flashed for
;   the first time. 115200 is eight times slower and almost always
;   connects. Raise it again once one upload has succeeded.
;
;   The port was auto-detected and moved between COM11 and COM19
;   across attempts. Disconnecting the board proved COM11 is the
;   board, so it is pinned. No more guessing mid-session.
;
; BOARD DEFINITION AND LIBRARIES - unchanged, must be in place:
;   boards\ESP32-S3-Touch-LCD-7B.json
;   lib\   the whole folder from the Waveshare demo,
;          PlatformIO/13_LVGL_TRANSPLANT/lib
;   boards and lib are SIBLINGS, both directly under panel_shemi.
;
; PANEL TIMINGS, recorded so they survive the demo package:
;   1024 x 600, PCLK 30 MHz, 16 bpp, 16-bit bus, 2 framebuffers
;   hsync: pulse 162, back porch 152, front porch 48
;   vsync: pulse 45,  back porch 13,  front porch 3
;   pclk_active_neg = 1,  bounce buffer = 1024 x 10 px
;
; TO UPLOAD
;   Hold BOOT, press and release RESET, release BOOT, then Upload.
;   The screen staying dark and the monitor saying "waiting for
;   download" is how you know the ROM bootloader was entered.
;   Press RESET after a successful upload to run.
;
; ============================================================

[env:ESP32-S3-Touch-LCD-7B]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

board     = ESP32-S3-Touch-LCD-7B
framework = arduino

; Pinned, not auto-detected. Change both if the port ever moves.
upload_port  = COM11
monitor_port = COM11

upload_speed  = 115200
monitor_speed = 115200

; The monitor's DTR/RTS lines drive the auto-reset circuit. Left
; alone they can drop the board into ROM download mode on connect.
monitor_rts = 0
monitor_dtr = 0

build_flags =
        -DDISABLE_ALL_LIBRARY_WARNINGS
        -DUSB_MODE=1
        -DARDUINO_USB_CDC_ON_BOOT=0
        -DCORE_DEBUG_LEVEL=1
        -I src

; ============================================================
; END OF FILE - PANEL SHEMI - TEST 002 (7B bring-up, upload fix)
; ============================================================
