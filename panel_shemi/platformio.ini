; ============================================================
; PANEL SHEMI - TEST 009 (on/off contrast)
; ============================================================
;
; Waveshare ESP32-S3-Touch-LCD-7B, 1024 x 600.
;
; WHAT CHANGED vs TEST 002
;   Nothing here. TEST 002 uploaded and ran: 1024x600 confirmed,
;   GT911 touch confirmed, backlight through the IO expander
;   confirmed, PSRAM read 8,384,788 free of 8,388,608 - a genuine
;   8 MB part, not a downgraded clone.
;
;   All the change is in main.cpp, which now draws the home screen.
;
; NEEDED IN include/  - all already in the repo under panel_shemi:
;   tile_img.h     eight 200x200 tile icons
;   lamp_img.h     the 200x200 lamp
;   fan_img.h      the 200x200 ceiling fan, recovered from TEST 082
;   font_hebrew.h  font_hebrew_28, Hebrew and Latin
;
; STILL NEEDED, unchanged:
;   boards\ESP32-S3-Touch-LCD-7B.json
;   lib\   the whole folder from the Waveshare demo.
;   boards and lib are SIBLINGS directly under panel_shemi.
;
; UPLOAD
;   Hold BOOT, press and release RESET, release BOOT, then Upload.
;   The screen staying dark is how you know the ROM bootloader was
;   entered. Press RESET afterwards to run.
;
; ============================================================

[env:ESP32-S3-Touch-LCD-7B]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

board     = ESP32-S3-Touch-LCD-7B
framework = arduino

upload_port  = COM11
monitor_port = COM11

upload_speed  = 115200
monitor_speed = 115200

monitor_rts = 0
monitor_dtr = 0

; The monitor does not echo typed characters by default, so commands
; are entered blind. send_on_enter buffers the line and sends it on
; Enter; echo prints it back as it is typed.
monitor_filters = send_on_enter, echo

build_flags =
        -DDISABLE_ALL_LIBRARY_WARNINGS
        -DUSB_MODE=1
        -DARDUINO_USB_CDC_ON_BOOT=0
        -DCORE_DEBUG_LEVEL=1
        -I src
        -I include

; ============================================================
; END OF FILE - PANEL SHEMI - TEST 009 (on/off contrast)
; ============================================================
