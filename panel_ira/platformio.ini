; ============================================================
;  IRA PANEL - Waveshare ESP32-S3-Touch-LCD-4.3
;  ESP32-S3-WROOM-1-N16R8   16 MB flash, 8 MB octal PSRAM
; ============================================================
;
;  WHY THIS LOOKS ALMOST EXACTLY LIKE panel/platformio.ini
;
;  The first version of this file tried to force Arduino core 3.0.7
;  on top of platform 6.9.0, because Waveshare's notes ask for 3.x.
;  It failed with:
;
;      KeyError: 'framework-arduinoespressif32-libs'
;
;  which is platform 6.9.0 looking for a package that the core taken
;  straight from GitHub does not provide. The two cannot be mixed
;  that way.
;
;  And the requirement was wrong anyway. Waveshare want core 3.x for
;  their RS-485 driver. This firmware does not touch RS-485 yet - it
;  drives a screen and a touch controller, and Shemi's panel has been
;  driving an identical 800x480 RGB panel on core 2.x for months.
;
;  So: the exact configuration already proven on this bench. When
;  RS-485 arrives, and if core 3.x really is needed then, the move is
;  to the pioarduino platform fork - not to a package override.
;
;  FLASH SIZE - the trap that already cost this project a day:
;  board_build.* and board_upload.* are DIFFERENT settings and BOTH
;  are needed. Without the upload pair the bootloader assumes an N8
;  part and a 16 MB image reboots forever with no useful error.
; ============================================================

[env:irapanel]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter
; The monitor must not drive RTS/DTR or it can hold the board in reset.
; Cost: opening the monitor no longer resets the board, so the boot
; banner is missed. Press RST to see it.
monitor_rts = 0
monitor_dtr = 0

; ---- memory: 16 MB flash, 8 MB OCTAL psram ----
; qio_opi = QUAD flash, OCTAL psram. This is what the board actually is.
; opi_opi claims octal FLASH as well, and the ROM checks the eFuse,
; finds it not set, and aborts before setup() ever runs:
;    E (177) cpu_start: Octal Flash option selected, but EFUSE not configured!
; That is a boot loop with no useful message. Do not change this line.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; LVGL is configured from the command line, exactly like Shemi's panel.
    ; There is no lv_conf.h in either project and there must not be: the
    ; Hebrew strings are stored PRE-REVERSED, and switching bidi support
    ; on would reverse them a second time and produce nonsense.
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    ; TEST 021: THE MISSING LINE.
    ; Without a tick source LVGL does not know time has passed, so
    ; lv_timer_handler() renders nothing and never polls the input
    ; device. The screen freezes and touch appears dead even though
    ; the touch chip is reporting perfect coordinates on serial.
    ; Shemi's panel has had this line all along; this file did not.
    -DLV_TICK_CUSTOM=1
    -DLV_MEM_SIZE=65536
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_USE_PERF_MONITOR=0

lib_deps =
    ; PINNED, not "^". The Arduino_ESP32RGBPanel constructor changed
    ; shape in later GFX releases. 1.3.8 is the version already running
    ; on Shemi's panel, so it is the version that gets used here.
    moononournation/GFX Library for Arduino @ 1.3.8
    lvgl/lvgl @ ^8.3.11
    bitbank2/JPEGDEC @ ^1.6.2
    ; TEST 019: bb_captouch was removed. It auto-detects the touch
    ; controller by probing common addresses, one of which is 0x38 -
    ; and on this board 0x38 is the CH422G expander. It "found" a
    ; FocalTech part that is not there and then failed every read.
    ; No way to force the type, so the driver is written directly.

; ============================================================
;  FIRST BUILD CHECKLIST
;    1. include/boot_photo.h must be present or the build stops at
;       the #include with a one-line error.
;    2. Use the USB-C socket marked UART, not the one marked USB.
;       ARDUINO_USB_CDC_ON_BOOT=0 sends the console to GPIO43/44,
;       which is the UART socket. The other one prints nothing.
;    3. Serial should print:
;         === IRA PANEL - TEST 001 - Waveshare ESP32-S3-Touch-LCD-4.3 ===
;         PSRAM: 8388608 bytes free
;       A small PSRAM number means opi_opi did not take.
;    4. A black screen with NO serial output means the failure is
;       before setup() - almost always the memory settings.
;    5. If the port will not appear: hold BOOT, plug in, release BOOT.
; ============================================================