; ============================================================
; IR LEARN - TEST 006 (transmit + receive)
; ============================================================
;
; ESP32-S3-DevKitC-1 N16R8.
;
; IR receiver (TSOP1838 / VS1838B):
;    OUT -> GPIO 11      VCC -> 3V3      GND -> GND
;    100nF across VCC and GND, close to the receiver.
;
; IR transmitter on GPIO 10.
;    Ready-made module:  S -> GPIO 10,  VCC -> 5V,  GND -> GND
;    Bare LED:  NEVER straight off a GPIO. Use a transistor:
;        GPIO 10 --[1k]-- base (2N2222 / BC337 / S8050)
;                         emitter -- GND
;        5V --[100R]-- LED anode,  LED cathode -- collector
;    100R for bench work. 33R to 47R for the final unit.
;
; ============================================================

[env:esp32s3]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu                 = esp32s3
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv

board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
upload_speed  = 921600
monitor_rts   = 0
monitor_dtr   = 0

lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0

; ============================================================
; END OF FILE - IR LEARN - TEST 006 (transmit + receive)
; ============================================================
