; ============================================================
;   Bg_Bed  —  listener  —  TEST 010  —  record and dump
; ============================================================
;
;   Board:  ESP32-S3-DevKitC-1  N16R8   (16MB flash, 8MB octal PSRAM)
;
;   THIS FILE MUST START WITH A SEMICOLON.
;   If the first character is a slash, a .cpp has been dropped
;   into this slot by mistake - that is what caused
;   "File contains no section headers".
;
;   monitor_speed 921600
;       850 kB of base64 at 115200 would take over a minute.
;       If the dump looks like garbage characters, the USB bridge
;       cannot keep up - tell me and I will lower it in BOTH this
;       file and Serial.begin() in main.cpp.
;
;   monitor_filters = log2file
;       Writes the monitor output to
;           listener/logs/device-monitor-<date>.log
;       which is what wav_convert.py reads.

[env:listener]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 921600
monitor_rts     = 0
monitor_dtr     = 0
monitor_filters = log2file

board_build.mcu                  = esp32s3
board_build.flash_mode           = qio
board_build.psram_type           = opi
board_build.arduino.memory_type  = qio_opi
board_build.flash_size           = 16MB

board_upload.flash_size    = 16MB
board_upload.maximum_size  = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; ============================================================
;   END  —  Bg_Bed  —  listener  —  TEST 010
; ============================================================
